<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Reklam Tespit Sistemi</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f;
  --bg2: #14141d;
  --bg3: #1d1d2a;
  --bg4: #262636;
  --border: #2e2e42;
  --border2: #3a3a52;
  --text: #f0f0f6;
  --dim: #8a8aa0;
  --dimmer: #5a5a70;
  --accent: #ff4444;
  --accent2: #ff6b35;
  --green: #44cc88;
  --amber: #ffaa22;
  --red: #ff4466;
  --blue: #5a8cff;
  --purple: #8b5cf6;
}
body {
  background: var(--bg); color: var(--text); font-size: 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; line-height: 1.5;
}

.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

/* Sidebar */
.sidebar {
  background: var(--bg2); border-right: 1px solid var(--border);
  padding: 18px; display: flex; flex-direction: column; gap: 16px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand {
  display: flex; align-items: center; gap: 10px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.brand-icon {
  width: 32px; height: 32px; background: var(--accent); border-radius: 7px;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.brand-name { font-size: 14px; font-weight: 600; }
.brand-ver { font-size: 10px; color: var(--dim); margin-top: 1px; }

.section-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--dimmer); font-weight: 600; margin-bottom: 8px;
}

.btn {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: all 0.1s;
  font-family: inherit;
}
.btn:hover { background: var(--bg4); border-color: var(--border2); }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: white; font-weight: 500;
}
.btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.full { width: 100%; justify-content: center; }
.btn.sm { padding: 5px 10px; font-size: 12px; }

/* Key card */
.key-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px;
}
.key-row {
  display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 5px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.dot.empty { background: var(--dimmer); }
.key-pv { color: var(--dim); font-family: monospace; font-size: 10px; }

/* Queue card */
.queue-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-size: 11px;
}
.queue-status-line { display: flex; justify-content: space-between; margin-bottom: 5px; }
.queue-msg { color: var(--dim); font-size: 10px; word-break: break-word; }

/* Nav */
.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-item {
  padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
  color: var(--dim); display: flex; align-items: center; gap: 8px;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bg3); color: var(--text); }

/* Main */
.main { padding: 28px 32px; max-width: 1400px; }
.page-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 22px;
}
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.subtitle { color: var(--dim); font-size: 13px; margin-top: 4px; }

/* Channel grid */
.channel-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
}
.channel-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; cursor: pointer; transition: all 0.15s;
}
.channel-card:hover { border-color: var(--border2); transform: translateY(-1px); }
.cc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cc-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--bg4);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: var(--accent);
}
.cc-name { font-size: 15px; font-weight: 500; }
.cc-handle { font-size: 11px; color: var(--dimmer); margin-top: 1px; }
.cc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.cc-stat {
  background: var(--bg3); border-radius: 6px; padding: 8px;
  text-align: center;
}
.cc-stat-num { font-size: 17px; font-weight: 600; }
.cc-stat-lbl { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
.cc-top-brands {
  display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px;
}
.brand-pill {
  background: var(--bg3); font-size: 10px; padding: 2px 7px; border-radius: 10px;
  color: var(--dim); border: 1px solid var(--border);
}
.brand-pill.hot { color: var(--accent); border-color: var(--accent); }

/* Tools bar */
.tools-bar {
  display: flex; gap: 8px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;
}
.tools-bar .spacer { flex: 1; }

/* Stat tiles */
.stat-tiles {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px; margin-bottom: 22px;
}
.stat-tile {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px;
}
.stat-tile-num { font-size: 22px; font-weight: 600; line-height: 1.1; }
.stat-tile-lbl {
  font-size: 10px; color: var(--dim); text-transform: uppercase;
  letter-spacing: 0.05em; margin-top: 5px;
}
.stat-tile.red .stat-tile-num { color: var(--accent); }
.stat-tile.amber .stat-tile-num { color: var(--amber); }
.stat-tile.green .stat-tile-num { color: var(--green); }
.stat-tile.blue .stat-tile-num { color: var(--blue); }

/* Section */
.section {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; margin-bottom: 16px;
}
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.section-title-lg { font-size: 15px; font-weight: 500; }

/* Donut chart container */
.donut-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.donut-svg { flex-shrink: 0; }
.donut-legend { flex: 1; min-width: 200px; }
.legend-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 0;
  font-size: 13px;
}
.legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.legend-label { flex: 1; }
.legend-count { color: var(--dim); font-variant-numeric: tabular-nums; }

/* Video list */
.video-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.video-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; cursor: pointer; transition: all 0.15s;
}
.video-card:hover { border-color: var(--border2); }
.video-thumb {
  width: 100%; aspect-ratio: 16/9; background: var(--bg);
  object-fit: cover; display: block;
}
.video-body { padding: 10px 12px; }
.video-title {
  font-size: 12px; font-weight: 500; margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; line-height: 1.4;
}
.video-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--dim);
}
.video-ad-badge {
  background: rgba(255,68,68,0.15); color: var(--accent);
  padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 500;
}
.video-ad-badge.zero { background: rgba(68,204,136,0.15); color: var(--green); }

/* Setup overlay */
.setup-overlay {
  position: fixed; inset: 0; background: rgba(10,10,15,0.92);
  display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
}
.setup-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
  max-width: 460px; width: 100%; padding: 28px;
}
.setup-title { font-size: 19px; font-weight: 600; margin-bottom: 6px; }
.setup-desc { color: var(--dim); font-size: 12px; margin-bottom: 16px; line-height: 1.6; }
.setup-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 10px 12px; border-radius: 8px; font-family: monospace; font-size: 12px; margin-bottom: 10px;
}
.setup-help { font-size: 10px; color: var(--dimmer); margin-top: 12px; line-height: 1.5; }
.setup-help a { color: var(--blue); }

/* Empty */
.empty-card {
  background: var(--bg2); border: 1px dashed var(--border); border-radius: 12px;
  padding: 40px 20px; text-align: center; color: var(--dim);
}

/* Timeline mini */
.tl-mini {
  height: 38px; background: var(--bg3); border-radius: 6px;
  position: relative; overflow: hidden; display: flex;
}
.tl-cell { flex: 1; }
.tl-cell.h { background: var(--accent); }
.tl-cell.m { background: var(--amber); }
.tl-cell.c { background: transparent; }

/* Video detail */
.video-detail-thumb {
  width: 200px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover;
  background: var(--bg3); flex-shrink: 0;
}
.video-detail-head { display: flex; gap: 18px; margin-bottom: 18px; }
.video-detail-title { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
.video-detail-meta { font-size: 12px; color: var(--dim); }

/* Det grid (frame cards) */
.det-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
}
.det-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; cursor: pointer;
}
.det-card:hover { border-color: var(--border2); }
.det-card.h { border-left: 3px solid var(--accent); }
.det-card.m { border-left: 3px solid var(--amber); }
.det-card.c { opacity: 0.5; border-left: 3px solid var(--green); }
.det-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.det-body { padding: 8px 10px; }
.det-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.det-ts { font-family: monospace; font-size: 11px; font-weight: 500; }
.det-pill {
  font-size: 9px; padding: 1px 6px; border-radius: 8px; font-weight: 500;
}
.det-pill.h { background: rgba(255,68,68,0.15); color: var(--accent); }
.det-pill.m { background: rgba(255,170,34,0.15); color: var(--amber); }
.det-pill.c { background: rgba(68,204,136,0.15); color: var(--green); }
.det-sum { font-size: 10px; color: var(--dim); display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }

.det-filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-btn {
  background: var(--bg3); border: 1px solid var(--border); color: var(--dim);
  padding: 5px 11px; border-radius: 14px; font-size: 11px; cursor: pointer;
}
.filter-btn:hover { color: var(--text); }
.filter-btn.active { background: var(--bg4); color: var(--text); }

/* Modal */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
  align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal.on { display: flex; }
.modal-content {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  max-width: 760px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 22px;
}
.modal-close { float: right; background: none; border: none; color: var(--dim);
  font-size: 20px; cursor: pointer; line-height: 1; }

/* Brand bar */
.brand-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; }
.brand-bar-name { width: 110px; }
.brand-bar-track { flex: 1; height: 16px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.brand-bar-fill { height: 100%; background: var(--accent); }
.brand-bar-count { width: 32px; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { height: auto; position: relative; }
  .main { padding: 16px; }
}
</style>
</head>
<body>

<div class="setup-overlay" id="setupOv" style="display:none">
  <div class="setup-card">
    <div class="setup-title">🔑 Gemini API Anahtarı</div>
    <div class="setup-desc">
      Devam etmek için Gemini API anahtarı girin. Anahtar yalnızca sizin bilgisayarınızda saklanır.
    </div>
    <input type="password" class="setup-input" id="setupKey" placeholder="AIza...">
    <button class="btn primary full" onclick="saveKey()">Kaydet ve Başla</button>
    <div class="setup-help">
      Anahtar almak için: <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
    </div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-icon">▶</div>
      <div>
        <div class="brand-name">Reklam Tespit</div>
        <div class="brand-ver">v3 · Multi-Channel</div>
      </div>
    </div>

    <div>
      <div class="section-title">API</div>
      <div class="key-card">
        <div class="key-row"><div class="dot" id="keyDot"></div><span id="keyStatus">Yükleniyor...</span></div>
        <div class="key-pv" id="keyPv"></div>
        <span style="font-size:10px;color:var(--blue);cursor:pointer" onclick="openSetup()">Değiştir</span>
      </div>
    </div>

    <div>
      <div class="section-title">Sıra</div>
      <div class="queue-card">
        <div class="queue-status-line">
          <span id="queueState" style="color:var(--green)">Boş</span>
          <span id="queueLen" style="color:var(--dim)">0</span>
        </div>
        <div class="queue-msg" id="queueMsg">Hazır</div>
        <button class="btn sm full" id="cancelQueueBtn" style="margin-top:6px;display:none" onclick="cancelQueue()">
          Sırayı İptal Et
        </button>
      </div>
    </div>

    <div>
      <div class="section-title">Menü</div>
      <div class="nav">
        <div class="nav-item active" onclick="goHome()" id="navHome">
          <i class="ti ti-home"></i> Kanallar
        </div>
        <div class="nav-item" onclick="goLive(null)" id="navLive" style="display:none">
          <i class="ti ti-broadcast" style="color:var(--accent)"></i> Canlı Analiz
        </div>
        <div class="nav-item" onclick="openSetup()">
          <i class="ti ti-settings"></i> Ayarlar
        </div>
      </div>
    </div>

    <div style="font-size:10px;color:var(--dimmer);text-align:center;padding-top:10px;border-top:1px solid var(--border)">
      ~$0.005 / frame
    </div>
  </div>

  <div class="main" id="main">
    <!-- içerik dinamik yüklenir -->
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = { page: 'home', channelId: null, videoId: null, filter: 'all', browseFilter: 'all' };

// ─── Init ───
window.addEventListener('DOMContentLoaded', async () => {
  await refreshKey();
  goHome();
  pollQueue();
});

// ─── Key ───
async function refreshKey() {
  const r = await fetch('/api/config');
  const d = await r.json();
  if (d.has_key) {
    $('keyDot').classList.remove('empty');
    $('keyStatus').textContent = 'Aktif';
    $('keyPv').textContent = d.key_preview;
    $('setupOv').style.display = 'none';
  } else {
    $('keyDot').classList.add('empty');
    $('keyStatus').textContent = 'Yok';
    $('keyPv').textContent = '';
    $('setupOv').style.display = 'flex';
  }
}
function openSetup() { $('setupOv').style.display = 'flex'; setTimeout(()=>$('setupKey').focus(),50); }
async function saveKey() {
  const k = $('setupKey').value.trim();
  if (!k) { alert('Anahtar boş olamaz'); return; }
  await fetch('/api/config', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({gemini_api_key: k})
  });
  $('setupKey').value = '';
  await refreshKey();
}

// ─── Queue polling ───
async function pollQueue() {
  try {
    const r = await fetch('/api/queue');
    const d = await r.json();
    const stateEl = $('queueState'), lenEl = $('queueLen'), msgEl = $('queueMsg');
    const cancelBtn = $('cancelQueueBtn');

    if (d.running) {
      stateEl.textContent = 'Çalışıyor';
      stateEl.style.color = 'var(--amber)';
      cancelBtn.style.display = 'block';
    } else {
      stateEl.textContent = 'Boş';
      stateEl.style.color = 'var(--green)';
      cancelBtn.style.display = 'none';
    }
    lenEl.textContent = d.queue_length;
    msgEl.textContent = (d.message || '').slice(0, 80);

    // Aktif video varsa sidebar'da Canlı menüsünü göster
    const navLive = $('navLive');
    if (d.running) {
      if (navLive) navLive.style.display = 'flex';
    } else {
      if (navLive) navLive.style.display = 'none';
    }
  } catch (e) {}
  setTimeout(pollQueue, 5000);
}

async function cancelQueue() {
  if (!confirm('Tüm sıra iptal edilsin mi?')) return;
  await fetch('/api/cancel-queue', {method:'POST'});
}

// ─── Navigation ───
function goHome() {
  stopLivePolling();
  state.page = 'home';
  state.channelId = null;
  state.videoId = null;
  $('navHome').classList.add('active');
  loadHome();
}

async function loadHome() {
  const r = await fetch('/api/channels');
  const d = await r.json();

  let html = `
    <div class="page-header">
      <div>
        <h1>Kanal Takip Paneli</h1>
        <div class="subtitle">${d.channels.length} kanal · Sponsor & marka tespit analizi</div>
      </div>
    </div>

    <div class="tools-bar">
      <button class="btn primary" onclick="scanAll(24)">
        <i class="ti ti-player-play"></i> Son 24 Saati Tara
      </button>
      <button class="btn" onclick="scanAll(72)">Son 3 Gün</button>
      <button class="btn" onclick="scanAll(168)">Son 1 Hafta</button>
      <div class="spacer"></div>
      <button class="btn" onclick="addChannelPrompt()">
        <i class="ti ti-plus"></i> Kanal Ekle
      </button>
    </div>

    <div class="section" style="margin-bottom:20px">
      <div class="section-head"><div class="section-title-lg">Manuel Video Analizi</div></div>
      <div style="display:flex;gap:8px">
        <input type="text" id="manualUrlInput" placeholder="https://www.youtube.com/watch?v=..."
          style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);
          padding:10px 14px;border-radius:8px;font-size:13px;font-family:monospace"
          onkeypress="if(event.key==='Enter') analyzeManualUrl()">
        <button class="btn primary" onclick="analyzeManualUrl()">▶ Analiz Et</button>
      </div>
    </div>
  `;

  // Aggregate stats
  const totalVids = d.channels.reduce((s,c)=>s+c.video_count,0);
  const totalAds = d.channels.reduce((s,c)=>s+c.total_ads,0);
  const activeChannels = d.channels.filter(c=>c.video_count>0).length;

  html += `<div class="stat-tiles">
    <div class="stat-tile"><div class="stat-tile-num">${d.channels.length}</div><div class="stat-tile-lbl">Takipteki Kanal</div></div>
    <div class="stat-tile blue"><div class="stat-tile-num">${activeChannels}</div><div class="stat-tile-lbl">Aktif</div></div>
    <div class="stat-tile"><div class="stat-tile-num">${totalVids}</div><div class="stat-tile-lbl">Analiz Edilen Video</div></div>
    <div class="stat-tile red"><div class="stat-tile-num">${totalAds}</div><div class="stat-tile-lbl">Toplam Reklam Frame</div></div>
  </div>`;

  if (d.channels.length === 0) {
    html += `<div class="empty-card">
      <i class="ti ti-broadcast" style="font-size:36px;display:block;margin-bottom:8px;opacity:0.3"></i>
      Henüz kanal yok. "Kanal Ekle" ile başla.
    </div>`;
  } else {
    html += `<div class="channel-grid">`;
    for (const ch of d.channels) {
      const initial = (ch.name || ch.id || '?').replace('@','').charAt(0).toUpperCase();
      const topBrandsHtml = (ch.top_brands || []).slice(0, 4).map(b =>
        `<span class="brand-pill ${b.count > 3 ? 'hot' : ''}">${esc(b.name)} ${b.count}</span>`
      ).join('') || '<span style="color:var(--dimmer);font-size:11px">Henüz veri yok</span>';

      html += `<div class="channel-card" onclick="goChannel('${esc(ch.id)}')">
        <div class="cc-head">
          <div class="cc-avatar">${initial}</div>
          <div>
            <div class="cc-name">${esc(ch.name || ch.id)}</div>
            <div class="cc-handle">${esc(ch.id)}</div>
          </div>
        </div>
        <div class="cc-stats">
          <div class="cc-stat"><div class="cc-stat-num">${ch.video_count}</div><div class="cc-stat-lbl">Video</div></div>
          <div class="cc-stat"><div class="cc-stat-num" style="color:var(--accent)">${ch.total_ads}</div><div class="cc-stat-lbl">Reklam</div></div>
          <div class="cc-stat"><div class="cc-stat-num">${ch.channel_logos.length}</div><div class="cc-stat-lbl">Kanal Logo</div></div>
        </div>
        <div class="cc-top-brands">${topBrandsHtml}</div>
      </div>`;
    }
    html += `</div>`;
  }

  $('main').innerHTML = html;
}

async function analyzeManualUrl() {
  const input = document.getElementById('manualUrlInput');
  const url = (input ? input.value : '').trim();
  if (!url) { alert('URL girin'); return; }
  if (!url.includes('youtu')) { alert('Geçerli YouTube URL\'si girin'); return; }
  const r = await fetch('/api/analyze/video', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url})
  });
  const d = await r.json();
  if (d.error) { alert('Hata: ' + d.error); return; }
  if (input) input.value = '';
  goLive(null);
}

async function addChannelPrompt() {
  const url = prompt('YouTube kanal URL\'si (örn: https://www.youtube.com/@kanalad):');
  if (!url) return;
  const r = await fetch('/api/config');
  const cfg = await r.json();
  const channels = cfg.channels || [];
  if (channels.includes(url)) { alert('Bu kanal zaten ekli'); return; }
  channels.push(url);
  await fetch('/api/config', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({channels})
  });
  loadHome();
}

async function scanAll(hours) {
  if (!confirm(`Tüm kanallardaki son ${hours} saatteki videolar taransın mı? Bu işlem uzun sürer ve API kullanır.`)) return;
  const r = await fetch('/api/scan/all', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({hours})
  });
  const d = await r.json();
  if (d.error) alert('Hata: ' + d.error);
  else alert(`${d.count} kanal sıraya alındı`);
}

async function scanChannel(channelUrl, hours) {
  const r = await fetch('/api/scan/channel', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({url: channelUrl, hours})
  });
  const d = await r.json();
  if (d.error) alert('Hata: ' + d.error);
}

// ─── Channel Browse (Manuel Video Seçim) ───
function goBrowse(channelId) {
  stopLivePolling();
  state.page = 'browse';
  state.channelId = channelId;
  loadBrowse(channelId);
}

async function loadBrowse(channelId) {
  $('main').innerHTML = `
    <div class="page-header">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="btn sm" style="cursor:pointer" onclick="goChannel('${esc(channelId)}')">
            <i class="ti ti-arrow-left"></i> Geri
          </span>
        </div>
        <h1>Video Seç</h1>
        <div class="subtitle">YouTube'dan kanaldaki videolar yükleniyor...</div>
      </div>
    </div>
    <div class="empty-card">
      <i class="ti ti-loader-2" style="font-size:32px;display:block;margin-bottom:8px;opacity:0.5"></i>
      Kanal videoları çekiliyor (yt-dlp), 5-10 saniye sürebilir...
    </div>
  `;

function renderBrowse(d) {
  const channelId = d.channel_id;
  const videos = d.videos || [];

  if (videos.length === 0) {
    $('main').innerHTML = `
      <div class="page-header">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span class="btn sm" style="cursor:pointer" onclick="goChannel('${esc(channelId)}')">
              <i class="ti ti-arrow-left"></i> Geri
            </span>
          </div>
          <h1>Manuel Video Seç</h1>
          <div class="subtitle">${esc(d.channel_name || channelId)}</div>
        </div>
        <button class="btn sm" onclick="loadBrowse('${esc(channelId)}')">
          <i class="ti ti-refresh"></i> Tekrar Dene
        </button>
      </div>
      <div class="empty-card">
        <i class="ti ti-mood-empty" style="font-size:32px;display:block;margin-bottom:8px;opacity:0.3"></i>
        <div style="margin-bottom:8px">Bu kanaldan video çekilemedi.</div>
        <div style="font-size:11px;color:var(--dimmer)">
          Terminal'i kontrol et — yt-dlp hatası olabilir. Kanal URL'sini kontrol et:
        </div>
        <div style="font-family:monospace;font-size:11px;color:var(--blue);margin-top:6px">
          ${esc(d.channel_url || '?')}
        </div>
      </div>
    `;
    return;
  }

  const counts = {
    not_analyzed: videos.filter(v => v.status === 'not_analyzed').length,
    analyzed: videos.filter(v => v.status === 'analyzed').length,
    queued: videos.filter(v => v.status === 'queued').length,
    processing: videos.filter(v => v.status === 'processing').length,
  };

  let html = `
    <div class="page-header">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="btn sm" style="cursor:pointer" onclick="goChannel('${esc(channelId)}')">
            <i class="ti ti-arrow-left"></i> ${esc(d.channel_name)}
          </span>
        </div>
        <h1>Manuel Video Seç</h1>
        <div class="subtitle">İstediğin videolara tıklayarak tek tek analiz başlat</div>
      </div>
      <div>
        <button class="btn sm" onclick="loadBrowse('${esc(channelId)}')">
          <i class="ti ti-refresh"></i> Yenile
        </button>
      </div>
    </div>

    <div class="stat-tiles">
      <div class="stat-tile"><div class="stat-tile-num">${videos.length}</div><div class="stat-tile-lbl">Toplam Video</div></div>
      <div class="stat-tile green"><div class="stat-tile-num">${counts.analyzed}</div><div class="stat-tile-lbl">Analiz Edildi</div></div>
      <div class="stat-tile amber"><div class="stat-tile-num">${counts.queued + counts.processing}</div><div class="stat-tile-lbl">Sırada / İşleniyor</div></div>
      <div class="stat-tile blue"><div class="stat-tile-num">${counts.not_analyzed}</div><div class="stat-tile-lbl">Henüz Yapılmadı</div></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title-lg">Videolar (${videos.length})</div>
        <div class="det-filters" style="margin-bottom:0">
          <div class="filter-btn ${state.browseFilter==='all'?'active':''}" onclick="setBrowseFilter('all','${esc(channelId)}')">Tümü</div>
          <div class="filter-btn ${state.browseFilter==='new'?'active':''}" onclick="setBrowseFilter('new','${esc(channelId)}')">Yeni</div>
          <div class="filter-btn ${state.browseFilter==='done'?'active':''}" onclick="setBrowseFilter('done','${esc(channelId)}')">Analiz Edildi</div>
        </div>
      </div>
      <div class="video-list" id="browseGrid">${renderBrowseCards(videos, state.browseFilter || 'all', channelId)}</div>
    </div>
  `;

  $('main').innerHTML = html;
  window._browseVideos = videos;
}

function renderBrowseCards(videos, filter, channelId) {
  let filtered = videos;
  if (filter === 'new') filtered = videos.filter(v => v.status === 'not_analyzed');
  else if (filter === 'done') filtered = videos.filter(v => v.status === 'analyzed');

  if (filtered.length === 0) {
    return '<div class="empty-card" style="grid-column:1/-1">Eşleşen video yok.</div>';
  }

  return filtered.map(v => {
    let statusBadge = '';
    let cardStyle = '';
    let clickHandler = `event.stopPropagation(); analyzeVideoFromBrowse('${esc(v.url)}', '${esc(channelId)}', this)`;
    let actionBtn = `<button class="btn sm primary" onclick="${clickHandler}"><i class="ti ti-player-play"></i> Analiz Et</button>`;

    if (v.status === 'analyzed') {
      statusBadge = '<span class="video-ad-badge zero">Tamamlandı</span>';
      cardStyle = 'opacity:0.85';
      actionBtn = `<button class="btn sm" onclick="event.stopPropagation(); goVideo('${esc(v.id)}')"><i class="ti ti-eye"></i> Görüntüle</button>`;
    } else if (v.status === 'processing') {
      statusBadge = '<span class="video-ad-badge" style="background:rgba(255,170,34,0.15);color:var(--amber)">İşleniyor</span>';
      actionBtn = `<button class="btn sm" disabled>İşleniyor...</button>`;
    } else if (v.status === 'queued') {
      statusBadge = '<span class="video-ad-badge" style="background:rgba(90,140,255,0.15);color:var(--blue)">Sırada</span>';
      actionBtn = `<button class="btn sm" disabled>Sırada</button>`;
    }

    const tabBadge = v.tab === 'streams' ?
      '<span class="video-ad-badge" style="background:rgba(255,68,102,0.15);color:var(--red)">Canlı Kayıt</span>' : '';

    return `<div class="video-card" style="${cardStyle}">
      <img class="video-thumb" src="${esc(v.thumbnail || '')}" loading="lazy" onerror="this.style.opacity=0.3">
      <div class="video-body">
        <div class="video-title">${esc(v.title)}</div>
        <div class="video-meta" style="margin-bottom:8px">
          <span>${fmtDur(v.duration)}</span>
          <span>${tabBadge} ${statusBadge}</span>
        </div>
        ${actionBtn}
      </div>
    </div>`;
  }).join('');
}

function setBrowseFilter(f, channelId) {
  state.browseFilter = f;
  const videos = window._browseVideos || [];
  $('browseGrid').innerHTML = renderBrowseCards(videos, f, channelId);
  // Filtre butonlarını güncelle
  document.querySelectorAll('.det-filters .filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.includes(
      f === 'all' ? 'Tümü' : f === 'new' ? 'Yeni' : 'Analiz Edildi'
    ));
  });
}

async function analyzeVideoFromBrowse(videoUrl, channelId, btnEl) {
  if (btnEl) {
    btnEl.disabled = true;
    btnEl.innerHTML = '<i class="ti ti-loader-2"></i> Başlatılıyor...';
  }
  const r = await fetch('/api/analyze/video', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url: videoUrl})
  });
  const d = await r.json();
  if (d.error) {
    alert('Hata: ' + d.error);
    if (btnEl) {
      btnEl.disabled = false;
      btnEl.innerHTML = '<i class="ti ti-player-play"></i> Analiz Et';
    }
    return;
  }
  // Canlı izleme sayfasına geç
  goLive(channelId);
}

// ─── Canlı Analiz İzleme ───
let livePollInterval = null;

function goLive(channelId) {
  state.page = 'live';
  state.channelId = channelId;
  $('navHome').classList.remove('active');
  startLivePolling();
}

function stopLivePolling() {
  if (livePollInterval) {
    clearInterval(livePollInterval);
    livePollInterval = null;
  }
}

function startLivePolling() {
  stopLivePolling();
  renderLiveLoading();
  pollLive();
  livePollInterval = setInterval(pollLive, 2000);
}

function renderLiveLoading() {
  $('main').innerHTML = `
    <div class="page-header">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="btn sm" style="cursor:pointer" onclick="exitLive()">
            <i class="ti ti-arrow-left"></i> Geri
          </span>
        </div>
        <h1>Canlı Analiz</h1>
        <div class="subtitle">Video bilgileri alınıyor...</div>
      </div>
    </div>
    <div class="empty-card">
      <i class="ti ti-loader-2" style="font-size:32px;display:block;margin-bottom:8px;opacity:0.5"></i>
      Hazırlanıyor...
    </div>
  `;
}

function exitLive() {
  stopLivePolling();
  if (state.channelId) goChannel(state.channelId);
  else goHome();
}

async function pollLive() {
  try {
    const r = await fetch('/api/live-video');
    const d = await r.json();
    if (!d.active) {
      // Belki bitti, son video sayfasına geç
      renderLiveEmpty();
      return;
    }
    renderLive(d);
    if (d.status === 'completed') {
      // 2 saniye sonra dur ve geç
      setTimeout(() => {
        stopLivePolling();
      }, 1000);
    }
  } catch (e) {}
}

function renderLiveEmpty() {
  if (state.page !== 'live') return;
  $('main').innerHTML = `
    <div class="page-header">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="btn sm" style="cursor:pointer" onclick="exitLive()">
            <i class="ti ti-arrow-left"></i> Geri
          </span>
        </div>
        <h1>Aktif Analiz Yok</h1>
        <div class="subtitle">Şu anda canlı analiz edilen video yok</div>
      </div>
    </div>
    <div class="empty-card">
      Analiz başlatmak için bir kanaldan video seçin.
    </div>
  `;
}

function renderLive(d) {
  if (state.page !== 'live') return;

  const dets = d.detections || [];
  const adFrames = dets.filter(x => x.reklam_var);
  const highFrames = adFrames.filter(x => x.guven === 'Yüksek');
  const total = d.total_steps || 1;
  const progress = d.progress || 0;

  let statusBadge = '';
  if (d.status === 'completed') {
    statusBadge = '<span class="video-ad-badge zero" style="margin-left:8px">✓ Tamamlandı</span>';
  } else if (d.status === 'analyzing') {
    statusBadge = '<span class="video-ad-badge" style="background:rgba(255,170,34,0.15);color:var(--amber);margin-left:8px"><i class="ti ti-loader-2"></i> Canlı</span>';
  } else {
    statusBadge = '<span class="video-ad-badge" style="background:rgba(90,140,255,0.15);color:var(--blue);margin-left:8px">Hazırlanıyor</span>';
  }

  let html = `
    <div class="page-header">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="btn sm" style="cursor:pointer" onclick="exitLive()">
            <i class="ti ti-arrow-left"></i> Geri
          </span>
          ${statusBadge}
        </div>
        <h1 style="font-size:18px">${esc(d.title || 'Video')}</h1>
        <div class="subtitle">${esc(d.channel_name || '')} · ${esc(d.message || '')}</div>
      </div>
      <div>
        <button class="btn" onclick="cancelQueue()" style="color:var(--red)">
          <i class="ti ti-player-stop"></i> Durdur
        </button>
        ${d.status === 'completed' ? `<button class="btn primary" onclick="goVideo('${esc(d.video_id)}')" style="margin-left:6px"><i class="ti ti-eye"></i> Detay</button>` : ''}
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title-lg">İlerleme</div>
        <div style="font-size:13px;color:var(--dim)">${d.current_frame || 0}/${total} frame · ${d.api_calls || 0} API çağrısı</div>
      </div>
      <div style="background:var(--bg3);border-radius:6px;height:10px;overflow:hidden">
        <div style="background:var(--accent);height:100%;width:${progress}%;transition:width 0.3s"></div>
      </div>
      <div style="text-align:right;font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums">
        %${Math.round(progress)}
      </div>
    </div>

    <div class="stat-tiles">
      <div class="stat-tile"><div class="stat-tile-num">${dets.length}</div><div class="stat-tile-lbl">Analiz Edilen</div></div>
      <div class="stat-tile red"><div class="stat-tile-num">${adFrames.length}</div><div class="stat-tile-lbl">Reklam</div></div>
      <div class="stat-tile amber"><div class="stat-tile-num">${highFrames.length}</div><div class="stat-tile-lbl">Yüksek Güven</div></div>
      <div class="stat-tile blue"><div class="stat-tile-num">${d.api_calls || 0}</div><div class="stat-tile-lbl">API Çağrısı</div></div>
    </div>
  `;

  // Timeline mini (canlı)
  if (dets.length > 0) {
    html += `<div class="section">
      <div class="section-head"><div class="section-title-lg">Canlı Zaman Çizelgesi</div></div>
      <div class="tl-mini">${dets.map(x => {
        let cls = 'c';
        if (x.reklam_var) cls = x.guven === 'Yüksek' ? 'h' : 'm';
        return `<div class="tl-cell ${cls}" title="${x.timestamp}"></div>`;
      }).join('')}</div>
    </div>`;
  }

  // Son tespit edilen frame'ler (ters sırada - en yenisi üstte)
  html += `<div class="section">
    <div class="section-head">
      <div class="section-title-lg">Anlık Frame Akışı</div>
      <div style="font-size:11px;color:var(--dim)">En yeni üstte</div>
    </div>`;

  if (dets.length === 0) {
    html += `<div class="empty-card">Frame'ler analiz edildikçe burada görünecek...</div>`;
  } else {
    const reversed = [...dets].reverse().slice(0, 30); // son 30 frame
    html += `<div class="det-grid">`;
    for (const x of reversed) {
      let cls = 'c', pcls = 'c', ptext = 'Temiz';
      if (x.reklam_var) {
        cls = x.guven === 'Yüksek' ? 'h' : 'm';
        pcls = x.guven === 'Yüksek' ? 'h' : 'm';
        ptext = x.guven;
      }
      const brandTags = (x.markalar || []).slice(0, 3).map(b => esc(b)).join(', ');
      html += `<div class="det-card ${cls}">
        <img class="det-thumb" src="${x.frame_url}" loading="lazy" onerror="this.style.opacity=0.3">
        <div class="det-body">
          <div class="det-row">
            <span class="det-ts">${x.timestamp}</span>
            <span class="det-pill ${pcls}">${ptext}</span>
          </div>
          <div class="det-sum">${esc(x.ozet || '')}</div>
          ${brandTags ? `<div style="font-size:10px;color:var(--accent)">${brandTags}</div>` : ''}
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  $('main').innerHTML = html;
}

// ─── Channel Detail ───
function goChannel(id) {
  stopLivePolling();
  state.page = 'channel';
  state.channelId = id;
  $('navHome').classList.remove('active');
  loadChannel(id);
}

async function loadChannel(id) {
  const r = await fetch('/api/channel-info?id=' + encodeURIComponent(id));
  const d = await r.json();
  if (d.error) { $('main').innerHTML = '<div class="empty-card">' + d.error + '</div>'; return; }

  const ch = d.channel;
  let html = `
    <div class="page-header">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="btn sm" style="cursor:pointer" onclick="goHome()">
            <i class="ti ti-arrow-left"></i> Kanallar
          </span>
        </div>
        <h1>${esc(ch.name)}</h1>
        <div class="subtitle">${esc(ch.id)} · ${d.videos.length} analiz edilen video</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" onclick="scanChannel('${esc(ch.url)}', 24)">
          <i class="ti ti-refresh"></i> Son 24h Tara
        </button>
        <button class="btn" onclick="scanChannel('${esc(ch.url)}', 168)">Son 1 Hafta</button>
        <button class="btn" onclick="goBrowse('${esc(ch.id)}')">
          <i class="ti ti-list-search"></i> Video Seç
        </button>
      </div>
    </div>
  `;

  const totalAds = d.videos.reduce((s,v)=>s+v.ad_frame_count,0);
  const avgAds = d.videos.length ? Math.round(totalAds / d.videos.length) : 0;

  html += `<div class="stat-tiles">
    <div class="stat-tile"><div class="stat-tile-num">${d.videos.length}</div><div class="stat-tile-lbl">Analiz Edilen</div></div>
    <div class="stat-tile red"><div class="stat-tile-num">${totalAds}</div><div class="stat-tile-lbl">Toplam Reklam</div></div>
    <div class="stat-tile amber"><div class="stat-tile-num">${avgAds}</div><div class="stat-tile-lbl">Video Başı Ort.</div></div>
    <div class="stat-tile"><div class="stat-tile-num">${ch.channel_logos.length}</div><div class="stat-tile-lbl">Tanınan Logo</div></div>
  </div>`;

  // Kanal logoları (kara liste)
  if (ch.channel_logos.length > 0) {
    html += `<div class="section">
      <div class="section-head"><div class="section-title-lg">Kanalın Kendi Logoları (Reklam Sayılmaz)</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${ch.channel_logos.map(l => `<span class="brand-pill" style="color:var(--blue);border-color:var(--blue)">${esc(l)}</span>`).join('')}
      </div>
    </div>`;
  }

  // Tür dağılımı
  if (d.type_totals.length > 0) {
    html += `<div class="section">
      <div class="section-head"><div class="section-title-lg">Reklam Türü Dağılımı</div></div>
      ${renderDonut(d.type_totals)}
    </div>`;
  }

  // Marka dağılımı
  if (d.brand_totals.length > 0) {
    const top10 = d.brand_totals.slice(0, 10);
    const max = Math.max(...top10.map(b=>b.count));
    html += `<div class="section">
      <div class="section-head"><div class="section-title-lg">En Çok Görülen Reklamverenler</div></div>
      <div>
        ${top10.map(b => `
          <div class="brand-bar-row">
            <div class="brand-bar-name">${esc(b.name)}</div>
            <div class="brand-bar-track"><div class="brand-bar-fill" style="width:${Math.round((b.count/max)*100)}%"></div></div>
            <div class="brand-bar-count">${b.count}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // Video listesi
  html += `<div class="section">
    <div class="section-head"><div class="section-title-lg">Analiz Edilen Videolar</div></div>`;

  if (d.videos.length === 0) {
    html += `<div class="empty-card">Bu kanal için henüz video analiz edilmedi. "Son 24h Tara" butonuna basın.</div>`;
  } else {
    html += `<div class="video-list">`;
    for (const v of d.videos) {
      const badgeClass = v.ad_frame_count === 0 ? 'zero' : '';
      const date = v.analyzed_at ? new Date(v.analyzed_at).toLocaleDateString('tr-TR') : '';
      html += `<div class="video-card" onclick="goVideo('${esc(v.id)}')">
        <img class="video-thumb" src="${esc(v.thumbnail || '')}" loading="lazy" onerror="this.style.opacity=0.3">
        <div class="video-body">
          <div class="video-title">${esc(v.title)}</div>
          <div class="video-meta">
            <span>${date} · ${fmtDur(v.duration)}</span>
            <span class="video-ad-badge ${badgeClass}">${v.ad_frame_count} reklam</span>
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  $('main').innerHTML = html;
}

function renderDonut(items) {
  const total = items.reduce((s,i)=>s+i.count, 0);
  if (total === 0) return '<div class="empty-card">Veri yok</div>';
  const colors = ['#ff4444', '#ffaa22', '#5a8cff', '#44cc88', '#8b5cf6', '#ff6b35', '#22ccaa', '#cc88ff'];
  let cx=85, cy=85, r=65, innerR=42;
  let cumulative = 0;
  let paths = '';
  let legend = '';
  items.forEach((item, idx) => {
    const fraction = item.count / total;
    const start = cumulative * 2 * Math.PI;
    const end = (cumulative + fraction) * 2 * Math.PI;
    cumulative += fraction;
    const x1 = cx + r * Math.sin(start);
    const y1 = cy - r * Math.cos(start);
    const x2 = cx + r * Math.sin(end);
    const y2 = cy - r * Math.cos(end);
    const x3 = cx + innerR * Math.sin(end);
    const y3 = cy - innerR * Math.cos(end);
    const x4 = cx + innerR * Math.sin(start);
    const y4 = cy - innerR * Math.cos(start);
    const largeArc = fraction > 0.5 ? 1 : 0;
    const color = colors[idx % colors.length];
    paths += `<path d="M${x1} ${y1} A${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L${x3} ${y3} A${innerR} ${innerR} 0 ${largeArc} 0 ${x4} ${y4} Z" fill="${color}" stroke="var(--bg2)" stroke-width="1.5"/>`;
    const pct = Math.round(fraction * 100);
    legend += `<div class="legend-row">
      <div class="legend-dot" style="background:${color}"></div>
      <div class="legend-label">${esc(item.name)}</div>
      <div class="legend-count">${item.count} (${pct}%)</div>
    </div>`;
  });
  return `<div class="donut-wrap">
    <svg class="donut-svg" width="170" height="170" viewBox="0 0 170 170">${paths}
      <text x="85" y="80" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="600">${total}</text>
      <text x="85" y="98" text-anchor="middle" fill="var(--dim)" font-size="10">tespit</text>
    </svg>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

// ─── Video Detail ───
function goVideo(id) {
  stopLivePolling();
  state.page = 'video';
  state.videoId = id;
  state.filter = 'all';
  loadVideo(id);
}

async function loadVideo(id) {
  const r = await fetch('/api/video/' + encodeURIComponent(id));
  const d = await r.json();
  if (d.error) { $('main').innerHTML = '<div class="empty-card">' + d.error + '</div>'; return; }

  const v = d.video;
  const ch = d.channel;
  let html = `
    <div class="page-header">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="btn sm" style="cursor:pointer" onclick="goChannel('${esc(ch.id)}')">
            <i class="ti ti-arrow-left"></i> ${esc(ch.name)}
          </span>
        </div>
        <h1 style="font-size:18px">${esc(v.title)}</h1>
        <div class="subtitle">Süre: ${fmtDur(v.duration)} · ${v.total_frames} frame analiz · ${v.api_calls} API çağrısı</div>
      </div>
    </div>

    <div class="stat-tiles">
      <div class="stat-tile red"><div class="stat-tile-num">${v.ad_frame_count}</div><div class="stat-tile-lbl">Reklam Frame</div></div>
      <div class="stat-tile"><div class="stat-tile-num">${v.total_frames}</div><div class="stat-tile-lbl">Toplam Frame</div></div>
      <div class="stat-tile blue"><div class="stat-tile-num">${Object.keys(v.brand_counts || {}).length}</div><div class="stat-tile-lbl">Tespit Edilen Marka</div></div>
      <div class="stat-tile amber"><div class="stat-tile-num">${Object.keys(v.type_counts || {}).length}</div><div class="stat-tile-lbl">Reklam Türü</div></div>
    </div>
  `;

  // Tür dağılımı
  const typeArr = Object.entries(v.type_counts || {}).map(([name, count]) => ({name, count}));
  if (typeArr.length > 0) {
    html += `<div class="section">
      <div class="section-head"><div class="section-title-lg">Reklam Türü Dağılımı</div></div>
      ${renderDonut(typeArr)}
    </div>`;
  }

  // Marka bar
  const brandArr = Object.entries(v.brand_counts || {})
    .map(([name, count]) => ({name, count}))
    .sort((a,b) => b.count - a.count);
  if (brandArr.length > 0) {
    const max = Math.max(...brandArr.map(b => b.count));
    html += `<div class="section">
      <div class="section-head"><div class="section-title-lg">Markalar</div></div>
      ${brandArr.map(b => `
        <div class="brand-bar-row">
          <div class="brand-bar-name">${esc(b.name)}</div>
          <div class="brand-bar-track"><div class="brand-bar-fill" style="width:${Math.round((b.count/max)*100)}%"></div></div>
          <div class="brand-bar-count">${b.count}</div>
        </div>
      `).join('')}
    </div>`;
  }

  // Timeline
  const dets = v.detections || [];
  html += `<div class="section">
    <div class="section-head"><div class="section-title-lg">Zaman Çizelgesi</div></div>
    <div class="tl-mini">${dets.map(d => {
      let cls = 'c';
      if (d.reklam_var) cls = d.guven === 'Yüksek' ? 'h' : 'm';
      return `<div class="tl-cell ${cls}" title="${d.timestamp} ${d.reklam_var ? '· ' + (d.markalar.join(', ') || 'reklam') : ''}"></div>`;
    }).join('')}</div>
  </div>`;

  // Frame grid
  html += `<div class="section">
    <div class="section-head"><div class="section-title-lg">Frame Detayları</div></div>
    <div class="det-filters">
      <div class="filter-btn ${state.filter==='all'?'active':''}" onclick="setFilter('all','${esc(id)}')">Tümü (${dets.length})</div>
      <div class="filter-btn ${state.filter==='ads'?'active':''}" onclick="setFilter('ads','${esc(id)}')">Sadece Reklamlar (${dets.filter(d=>d.reklam_var).length})</div>
      <div class="filter-btn ${state.filter==='high'?'active':''}" onclick="setFilter('high','${esc(id)}')">Yüksek Güven</div>
      <div class="filter-btn ${state.filter==='clean'?'active':''}" onclick="setFilter('clean','${esc(id)}')">Temiz</div>
    </div>
    <div class="det-grid">${renderDetCards(dets, state.filter)}</div>
  </div>`;

  $('main').innerHTML = html;
  // Modal işlemleri için detection'ları cache'le
  window._currentDets = dets;
}

function renderDetCards(dets, filter) {
  let filtered = dets;
  if (filter === 'ads') filtered = dets.filter(d => d.reklam_var);
  else if (filter === 'high') filtered = dets.filter(d => d.reklam_var && d.guven === 'Yüksek');
  else if (filter === 'clean') filtered = dets.filter(d => !d.reklam_var);

  if (filtered.length === 0) return '<div class="empty-card" style="grid-column:1/-1">Bu filtreyle eşleşen yok.</div>';

  return filtered.map(d => {
    let cls = 'c', pcls = 'c', ptext = 'Temiz';
    if (d.reklam_var) {
      cls = d.guven === 'Yüksek' ? 'h' : 'm';
      pcls = d.guven === 'Yüksek' ? 'h' : 'm';
      ptext = d.guven;
    }
    const brandTags = (d.markalar || []).slice(0, 3).map(b => esc(b)).join(', ');
    return `<div class="det-card ${cls}" onclick="showFrameDetail(${d.index})">
      <img class="det-thumb" src="${d.frame_url}" loading="lazy" onerror="this.style.opacity=0.3">
      <div class="det-body">
        <div class="det-row">
          <span class="det-ts">${d.timestamp}</span>
          <span class="det-pill ${pcls}">${ptext}</span>
        </div>
        <div class="det-sum">${esc(d.ozet || '')}</div>
        ${brandTags ? `<div style="font-size:10px;color:var(--accent)">${brandTags}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function setFilter(f, videoId) {
  state.filter = f;
  loadVideo(videoId);
}

function showFrameDetail(idx) {
  const dets = window._currentDets || [];
  const d = dets.find(x => x.index === idx);
  if (!d) return;
  let body = `
    <h2 style="font-size:16px;margin-bottom:4px">Frame @ ${d.timestamp}</h2>
    <div style="color:var(--dim);font-size:12px;margin-bottom:10px">${d.reklam_var ? d.guven + ' güven ile reklam' : 'Reklam yok'}</div>
    <img src="${d.frame_url}" style="width:100%;border-radius:8px;margin-bottom:10px">
    <div style="background:var(--bg3);border-radius:8px;padding:12px">
      <div style="font-size:12px;color:var(--dim);margin-bottom:4px">Özet</div>
      <div style="font-size:13px;margin-bottom:10px">${esc(d.ozet || '-')}</div>`;
  if (d.markalar && d.markalar.length) {
    body += `<div style="font-size:12px;color:var(--dim);margin-bottom:4px">Markalar</div>
      <div style="font-size:13px;margin-bottom:10px">${d.markalar.map(esc).join(', ')}</div>`;
  }
  if (d.tespitler && d.tespitler.length) {
    body += `<div style="font-size:12px;color:var(--dim);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">Tespitler</div>`;
    d.tespitler.forEach(t => {
      body += `<div style="background:var(--bg2);border-radius:6px;padding:8px;margin-top:6px;font-size:12px">
        <strong>${esc(t.tur || '-')}</strong>
        ${t.marka ? ' · <span style="color:var(--accent)">' + esc(t.marka) + '</span>' : ''}
        ${t.konum ? '<div style="color:var(--dim);margin-top:2px">' + esc(t.konum) + '</div>' : ''}
        ${t.detay ? '<div style="margin-top:3px">' + esc(t.detay) + '</div>' : ''}
      </div>`;
    });
  }
  body += `</div>`;
  $('modalBody').innerHTML = body;
  $('modal').classList.add('on');
}

function closeModal() { $('modal').classList.remove('on'); }

// ─── Utils ───
function fmtDur(s) {
  const t = parseInt(s) || 0;
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const sec = t % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
